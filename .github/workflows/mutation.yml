---
on:
  pull_request: &ignore-paths
    paths-ignore:
      - ".gitattributes"
      - ".gitignore"
      - "CHANGELOG.md"
      - "docs/**"
      - "README.md"

  push: *ignore-paths

name: mutation test

permissions:
  contents: read

jobs:
  mutation:
    uses: yii2-framework/actions/.github/workflows/infection.yml@4873e17a5d41412f13a94a616bc9d4b7eb66b93b # v2.0.3
    with:
      command-options: --threads=max
      extensions: mbstring, sockets, sodium
      php-ini-values: date.timezone=UTC, memory_limit=-1
      php-version: "[8.3]"
      phpstan: true
    secrets:
      STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}
