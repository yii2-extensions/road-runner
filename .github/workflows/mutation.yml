---
on:
  pull_request: &ignore-paths
    paths-ignore:
      - ".gitattributes"
      - ".gitignore"
      - "CHANGELOG.md"
      - "docs/**"
      - "README.md"

  push: *ignore-paths

name: mutation test

permissions:
  contents: read

jobs:
  mutation:
    uses: yii2-framework/actions/.github/workflows/infection.yml@d567d034022e972af3a14f4740d98b46e56ba593 # v2.0.4
    with:
      command-options: --threads=max
      extensions: mbstring, sockets, sodium
      ignore-platform-reqs-php-version: "[8.6]"
      php-ini-values: date.timezone=UTC, memory_limit=-1
      php-version: "[8.3]"
      phpstan: true
    secrets:
      STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}
