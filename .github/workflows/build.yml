---
on:
  pull_request: &ignore-paths
    paths-ignore:
      - ".gitattributes"
      - ".gitignore"
      - "CHANGELOG.md"
      - "docs/**"
      - "README.md"

  push: *ignore-paths

name: build

permissions:
  contents: read

jobs:
  phpunit:
    uses: yii2-framework/actions/.github/workflows/phpunit.yml@4873e17a5d41412f13a94a616bc9d4b7eb66b93b # v2.0.3
    with:
      composer-command: require yiisoft/yii2:22.0.x-dev
      concurrency-group: phpunit-${{ github.workflow }}-${{ github.ref }}
      ignore-platform-reqs: true
      extensions: intl, mbstring, sockets, sodium
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  phpunit-compatibility:
    uses: yii2-framework/actions/.github/workflows/phpunit.yml@4873e17a5d41412f13a94a616bc9d4b7eb66b93b # v2.0.3
    with:
      composer-command: require yiisoft/yii2:2.0.55
      concurrency-group: phpunit-compatibility-${{ github.workflow }}-${{ github.ref }}
      ignore-platform-reqs: true
      extensions: intl, mbstring, sockets, sodium
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
