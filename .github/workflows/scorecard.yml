---
on:
  branch_protection_rule:
  push:
    branches:
      - main
  schedule:
    - cron: "30 1 * * 6"

name: scorecard

permissions:
  contents: read

jobs:
  scorecard:
    uses: yii2-framework/actions/.github/workflows/scorecard.yml@4873e17a5d41412f13a94a616bc9d4b7eb66b93b # v2.0.3
    permissions:
      contents: read # Required to check out the repository.
      id-token: write # Required to sign published results with the GitHub OIDC token.
      security-events: write # Required to upload SARIF results to code scanning.
    with:
      publish-results: true
